<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Habits</title>
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#F7F6F3" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Habits" />
<link rel="apple-touch-icon" href="icon-180.png" />
<link rel="icon" href="icon-180.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#F7F6F3; --card:#FFFFFF; --ink:#15171C; --ink-2:#3F434B;
  --muted:#6B7280; --faint:#A5A29C;
  --line:#E8E5E0; --line-soft:#F1EFEB; --sunk:#EFEDE8;
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#4a3aa7;
  --c5:#e34948; --c6:#eda100; --c7:#e87ba4; --c8:#008300;
  --radius:16px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
  font-size:15px; line-height:1.45;
}
.num{font-variant-numeric:tabular-nums}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:15px;color:inherit}
.wrap{max-width:820px;margin:0 auto;padding:0 16px calc(96px + var(--safe-b))}

/* ---------- header ---------- */
.topbar{position:sticky;top:0;z-index:40;background:rgba(247,246,243,.86);backdrop-filter:saturate(180%) blur(14px);border-bottom:1px solid transparent;transition:border-color .2s}
.topbar.stuck{border-bottom-color:var(--line)}
.topbar-in{max-width:820px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;display:flex;align-items:center;gap:12px}
.brand{font-size:20px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:baseline;gap:8px}
.brand small{font-size:12px;font-weight:600;color:var(--faint);letter-spacing:0}
.spacer{flex:1}
.iconbtn{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--ink-2);transition:background .15s,color .15s}
.iconbtn:hover{background:var(--sunk)}
.sync{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--faint);padding:4px 9px;border-radius:999px;background:var(--sunk)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--faint);flex:none}
.dot.on{background:var(--c3)} .dot.off{background:#D6D3CE} .dot.err{background:var(--c5)}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:2px;background:var(--sunk);border-radius:12px;padding:3px;margin:4px 0 18px}
.tab{flex:1;padding:8px 4px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--muted);transition:all .18s;white-space:nowrap}
.tab.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(20,22,28,.06),0 2px 8px -4px rgba(20,22,28,.14)}

/* ---------- cards ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 1px 2px rgba(20,22,28,.03),0 10px 26px -20px rgba(20,22,28,.22)}
@media(hover:hover){.hcard:hover{box-shadow:0 1px 2px rgba(20,22,28,.04),0 14px 30px -18px rgba(20,22,28,.28)}}
.hero.perfect{background:linear-gradient(180deg,color-mix(in srgb,var(--c3) 7%,#fff),#fff)}
.sec-title{font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);margin:26px 2px 10px}

/* ---------- today hero ---------- */
.hero{display:flex;align-items:center;gap:18px;padding:18px 20px}
.ring{position:relative;width:66px;height:66px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .val{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:15.5px;font-weight:800;letter-spacing:-.03em;white-space:nowrap}
.ring .val .of{color:var(--faint);font-weight:700}
.ring .val svg{width:22px;height:22px;color:var(--c3)}
.hero-txt h2{margin:0;font-size:17px;font-weight:700;letter-spacing:-.01em}
.hero-txt p{margin:3px 0 0;font-size:13.5px;color:var(--muted)}
.hero-stat{margin-left:auto;text-align:right}
.hero-stat b{display:block;font-size:22px;font-weight:800;letter-spacing:-.02em}
.hero-stat span{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--faint)}

/* ---------- habit card ---------- */
.hcard{padding:15px 16px;margin-bottom:10px;transition:box-shadow .2s,transform .2s;display:flex;gap:14px;align-items:flex-start;position:relative;overflow:hidden}
.hcard::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c);opacity:0;transition:opacity .2s}
.hcard.done::before{opacity:1}
.hcard.pending{opacity:.66}
.check.pend{border-style:dashed;background:#fff}
.cell.pre{background:transparent;border:1px dashed var(--line);opacity:.6}
.pip.na{opacity:.3}
.soon{font-size:12px;font-weight:700;color:var(--faint);flex:none}
.check{position:relative;width:48px;height:48px;border-radius:16px;flex:none;display:grid;place-items:center;border:2px solid color-mix(in srgb,var(--c) 20%,#fff);background:color-mix(in srgb,var(--c) 8%,#fff);transition:transform .16s cubic-bezier(.34,1.6,.64,1),background .16s,border-color .16s}
.check.on{background:color-mix(in srgb,var(--c) 17%,#fff);border-color:var(--c)}
.badge{position:absolute;right:-6px;bottom:-6px;width:21px;height:21px;border-radius:50%;background:var(--c);border:2.5px solid #fff;display:grid;place-items:center;color:#fff}
.badge svg{width:11px;height:11px;stroke-width:3.5}
.em{font-size:24px;line-height:1;display:block}
.check:active{transform:scale(.9)}
.check.pop{animation:pop .34s cubic-bezier(.34,1.6,.64,1)}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.16)}100%{transform:scale(1)}}
.hbody{flex:1;min-width:0}
.hrow{display:flex;align-items:flex-start;gap:8px}
.hrow .acts{margin-left:auto;display:flex;align-items:center;gap:6px;flex:none;padding-top:2px}
.hname{font-size:16px;font-weight:700;letter-spacing:-.01em;margin:0}
.hsub{font-size:12.5px;color:var(--muted);margin:2px 0 0}
.streak{flex:none;display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;background:var(--sunk);color:var(--ink-2)}
.streak.hot{background:color-mix(in srgb,var(--c2) 12%,#fff);color:#b8461a}
.notebtn{width:30px;height:30px;border-radius:10px;flex:none;display:grid;place-items:center;background:var(--sunk);color:var(--faint);transition:all .15s}
.notebtn:hover{color:var(--ink-2)}
.notebtn.on{background:color-mix(in srgb,var(--c) 12%,#fff);color:var(--c)}
.notebtn svg{width:14px;height:14px}
.strip{display:flex;gap:5px;margin-top:12px}
.sday{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.sbox{width:100%;height:26px;border-radius:8px;background:var(--line-soft);transition:background .15s,transform .12s}
.sbox:active{transform:scale(.93)}
.sbox.on{background:var(--c)}
.sbox.pre{background:transparent;border:1px dashed var(--line);opacity:.6}
.sbox.today{box-shadow:0 0 0 2px #fff,0 0 0 3.5px color-mix(in srgb,var(--c) 55%,transparent)}
.sday small{font-size:9.5px;font-weight:700;color:var(--faint);letter-spacing:.03em}
.note{margin-top:11px;width:100%;border:1px solid var(--line-soft);background:#FCFBF9;border-radius:10px;padding:8px 10px;font-size:13.5px;resize:none;outline:none;min-height:34px;transition:border-color .15s}
.note:focus{border-color:var(--line);background:#fff}

/* ---------- period nav ---------- */
.pnav{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.pnav h3{margin:0;font-size:17px;font-weight:700;letter-spacing:-.01em}
.pnav .sub{font-size:12.5px;color:var(--muted);margin-top:1px}
.nav-b{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;border:1px solid var(--line);background:#fff;color:var(--ink-2);transition:background .15s}
.nav-b:hover{background:var(--sunk)} .nav-b:disabled{opacity:.35;cursor:default}
.today-b{padding:6px 12px;border-radius:999px;font-size:12.5px;font-weight:700;background:var(--ink);color:#fff}

/* ---------- week grid ---------- */
.wk{padding:14px 14px 8px}
.wdays,.wcells{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wdays{margin-bottom:10px}
.wrow{padding:11px 0;border-top:1px solid var(--line-soft)}
.wdays .hd{font-size:10px;font-weight:700;letter-spacing:.05em;color:var(--faint);text-align:center;text-transform:uppercase}
.wdays .hd b{display:block;font-size:12px;color:var(--muted);font-weight:700;margin-top:1px}
.wdays .hd.now b{color:var(--ink)}
.wlab-top{display:flex;align-items:center;gap:7px;min-width:0}
.wlab-top .em{font-size:16px;flex:none}
.wlab-top span{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.wlab-top b{font-size:12.5px;font-weight:700;color:var(--muted);flex:none}
.wlab-top b.hit{color:var(--c3)}
.cell{height:42px;border-radius:11px;background:var(--line-soft);display:grid;place-items:center;color:#fff;transition:background .15s,transform .12s}
.cell:active{transform:scale(.92)}
.cell.on{background:var(--c)}
.cell.now{box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--c) 45%,transparent)}
.cell.fut{opacity:.45}
.cell svg{width:15px;height:15px}
.wbar{height:5px;border-radius:3px;background:var(--line-soft);overflow:hidden;margin:7px 0 9px}
.wbar i{display:block;height:100%;border-radius:3px;background:var(--c)}

/* ---------- month ---------- */
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;padding:14px}
.mhd{font-size:10px;font-weight:700;letter-spacing:.05em;color:var(--faint);text-align:center;text-transform:uppercase;padding-bottom:2px}
.mday{aspect-ratio:1;border-radius:11px;border:1px solid var(--line-soft);background:#fff;padding:5px 4px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;transition:border-color .15s,transform .12s,background .15s}
.mday:active{transform:scale(.94)}
.mday.pad{visibility:hidden}
.mday.now{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.mday.fut{background:#FBFAF8;opacity:.6}
.mday .d{font-size:11.5px;font-weight:700;color:var(--ink-2);line-height:1}
.mday.fut .d{color:var(--faint)}
.pips{display:grid;grid-template-columns:1fr 1fr;gap:2.5px;width:100%;max-width:26px;margin-top:auto;margin-bottom:1px}
.pips.one{grid-template-columns:1fr;max-width:16px}
.pips.three{max-width:26px}
.pip{height:7px;border-radius:2.5px;background:var(--line-soft)}
.pip.on{background:var(--c)}
.legend{display:flex;flex-wrap:wrap;gap:12px;padding:2px 16px 14px}
.lg{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted)}
.lg i{width:9px;height:9px;border-radius:3px;background:var(--c);flex:none}
.lg .em{font-size:14px}

/* ---------- stats ---------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{padding:14px 15px}
.tile b{display:block;font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.tile span{font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--faint);margin-top:3px;display:block}
.tile em{font-style:normal;font-size:12.5px;color:var(--muted);font-weight:600}
.scard{padding:16px;margin-bottom:10px}
.shead{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.shead .em{font-size:18px;flex:none}
.shead h4{margin:0;font-size:15.5px;font-weight:700;letter-spacing:-.01em}
.shead .pct{margin-left:auto;font-size:12.5px;font-weight:700;color:var(--muted)}
.srow{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.sstat b{display:block;font-size:19px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.sstat span{font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--faint)}
.chart{display:flex;align-items:flex-end;gap:3px;height:74px;padding-top:4px}
.bar{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;height:100%;border-radius:4px 4px 0 0;position:relative}
.bar i{display:block;width:100%;border-radius:4px 4px 0 0;background:var(--c);min-height:2px;transition:opacity .15s}
.bar.empty i{background:var(--line-soft)}
.bar:hover i{opacity:.72}
.xax{display:flex;justify-content:space-between;font-size:10.5px;font-weight:600;color:var(--faint);margin-top:6px}
.chart-cap{font-size:11.5px;font-weight:600;color:var(--faint);margin:0 0 4px;letter-spacing:.02em}

/* ---------- tooltip ---------- */
#tip{position:fixed;z-index:90;pointer-events:none;background:var(--ink);color:#fff;font-size:12px;font-weight:600;padding:6px 9px;border-radius:8px;opacity:0;transform:translate(-50%,-118%);transition:opacity .12s;white-space:nowrap;box-shadow:0 6px 18px -6px rgba(0,0,0,.35)}
#tip.on{opacity:1}

/* ---------- modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(20,22,28,.34);backdrop-filter:blur(3px);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,100%);width:min(560px,100%);max-height:92vh;overflow-y:auto;background:var(--bg);border-radius:22px 22px 0 0;z-index:70;transition:transform .28s cubic-bezier(.32,.72,0,1);padding-bottom:calc(20px + var(--safe-b));-webkit-overflow-scrolling:touch}
.sheet.on{transform:translate(-50%,0)}
@media(min-width:640px){.sheet{bottom:auto;top:50%;border-radius:20px;transform:translate(-50%,-44%) scale(.97);opacity:0}.sheet.on{transform:translate(-50%,-50%) scale(1);opacity:1}}
.sheet-h{position:sticky;top:0;background:var(--bg);display:flex;align-items:center;gap:10px;padding:16px 18px 12px;border-bottom:1px solid var(--line);z-index:2}
.sheet-h h3{margin:0;font-size:17px;font-weight:700;letter-spacing:-.01em}
.sheet-b{padding:16px 18px}
.grab{width:36px;height:4px;border-radius:2px;background:#D9D5CE;margin:8px auto -4px}
@media(min-width:640px){.grab{display:none}}
.lbl{display:block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);margin:0 0 5px}
.inp{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;outline:none;transition:border-color .15s,box-shadow .15s}
.inp:focus{border-color:#B4AFA6;box-shadow:0 0 0 3px rgba(20,22,28,.05)}
.fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.ecard{padding:14px;margin-bottom:10px}
.ehead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.swatches{display:flex;gap:7px;flex-wrap:wrap;margin-top:6px}
.sw{width:26px;height:26px;border-radius:9px;border:2px solid transparent;transition:transform .12s}
.epick{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-top:6px}
.eb{aspect-ratio:1;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-size:17px;line-height:1;display:grid;place-items:center;transition:all .12s}
.eb:hover{background:#FAF9F7}
.eb.on{border-color:var(--ink);background:var(--sunk)}
.emoji-in{width:60px;text-align:center;font-size:20px;padding:6px}
.sw.on{border-color:var(--ink);transform:scale(1.06)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 15px;border-radius:11px;font-size:14px;font-weight:700;transition:all .15s}
.btn-dark{background:var(--ink);color:#fff}.btn-dark:hover{background:#2A2E36}
.btn-ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}.btn-ghost:hover{background:#FAF9F7}
.btn-red{background:#fff;border:1px solid #F0D6D6;color:var(--c5)}.btn-red:hover{background:#FEF3F3}
.btn-full{width:100%}
.row-b{display:flex;gap:8px;margin-top:14px}
.dayedit{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid var(--line-soft);width:100%;text-align:left}
.dayedit:last-child{border-bottom:0}
.dayedit .nm{font-size:14.5px;font-weight:600;flex:1;min-width:0}
.dstate{font-size:12.5px;font-weight:700;color:var(--faint);flex:none}
.dayedit.pending{opacity:.55}
.mini.pend{border-style:dashed;background:#fff}
.dayedit .mini.on + .nm + .dstate{color:var(--c)}
.mini{position:relative;width:38px;height:38px;border-radius:13px;border:2px solid color-mix(in srgb,var(--c) 20%,#fff);background:color-mix(in srgb,var(--c) 8%,#fff);display:grid;place-items:center;flex:none;transition:all .15s}
.mini.on{background:color-mix(in srgb,var(--c) 17%,#fff);border-color:var(--c)}
.mini .badge{right:-5px;bottom:-5px;width:18px;height:18px}
.mini .badge svg{width:10px;height:10px}
.mini svg{width:17px;height:17px}
.mini .em{font-size:18px}
.hint{font-size:12.5px;color:var(--muted);line-height:1.5}
.empty{text-align:center;padding:40px 20px;color:var(--muted);font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(24px + var(--safe-b));transform:translate(-50%,20px);background:var(--ink);color:#fff;font-size:13.5px;font-weight:600;padding:10px 16px;border-radius:999px;z-index:95;opacity:0;pointer-events:none;transition:all .22s;box-shadow:0 10px 30px -10px rgba(0,0,0,.4)}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="topbar" id="topbar">
  <div class="topbar-in">
    <div class="brand">Habits <small id="todayLbl"></small></div>
    <div class="spacer"></div>
    <div class="sync" id="syncPill"><span class="dot off"></span><span id="syncTxt">local</span></div>
    <button class="iconbtn" id="btnEdit" title="Edit habits" aria-label="Edit habits">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </div>
</div>

<div class="wrap">
  <div class="tabs" role="tablist">
    <button class="tab on" data-view="today">Today</button>
    <button class="tab" data-view="week">Week</button>
    <button class="tab" data-view="month">Month</button>
    <button class="tab" data-view="stats">Stats</button>
  </div>
  <div id="view"></div>
</div>

<div id="tip"></div>
<div class="toast" id="toast"></div>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet">
  <div class="grab"></div>
  <div class="sheet-h"><h3 id="sheetTitle">Edit</h3><div class="spacer"></div>
    <button class="iconbtn" id="sheetClose" aria-label="Close"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  </div>
  <div class="sheet-b" id="sheetBody"></div>
</div>

<script type="module">
/* ============================== constants ============================== */
const PAL = ['c1','c2','c3','c4','c5','c6','c7','c8'];

/* ============================== date utils ============================== */
const pad = n => String(n).padStart(2,'0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseISO = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const startOfWeek = d => addDays(d, -((d.getDay()+6)%7));           // Monday
const TODAY = () => iso(new Date());
const fmtDate = (d,o) => d.toLocaleDateString('en-US', o);
const daysBetween = (a,b) => Math.round((parseISO(b)-parseISO(a))/86400000);

/* ============================== state ============================== */
const LS = 'habits-v1';
let S = { habits: DEFAULTS.map(h=>({...h})), days: {}, cfgUpdated: 0 };
let view = 'today';
let weekAnchor = startOfWeek(new Date());
let monthAnchor = new Date(new Date().getFullYear(), new Date().getMonth(), 1);

function loadLocal(){
  try{
    const raw = localStorage.getItem(LS);
    if(!raw) return;
    const d = JSON.parse(raw);
    if(Array.isArray(d.habits) && d.habits.length) S.habits = d.habits;
    if(d.days && typeof d.days === 'object') S.days = d.days;
    S.cfgUpdated = d.cfgUpdated || 0;
  }catch(e){ console.warn('load failed', e); }
}
function saveLocal(){ try{ localStorage.setItem(LS, JSON.stringify(S)); }catch(e){} }

const habitById = id => S.habits.find(h=>h.id===id);
const entry = (date,id) => (S.days[date]||{})[id] || null;
const isDone = (date,id) => !!(entry(date,id)||{}).done;
const anyDone = date => { const d = S.days[date]; return !!d && S.habits.some(h=>d[h.id] && d[h.id].done); };
const active = (hb,date) => !hb.start || date >= hb.start;
const activeOn = date => S.habits.filter(h=>active(h,date));
const allDone = date => { const list = activeOn(date); return list.length>0 && list.every(h=>isDone(date,h.id)); };
const startTxt = hb => 'Starts ' + fmtDate(parseISO(hb.start), {weekday:'long', month:'long', day:'numeric'});

function setEntry(date, id, patch){
  if(!S.days[date]) S.days[date] = {};
  const cur = S.days[date][id] || {done:false, note:''};
  S.days[date][id] = {...cur, ...patch};
  const e = S.days[date][id];
  if(!e.done && !e.note) delete S.days[date][id];
  if(!Object.keys(S.days[date]).length) delete S.days[date];
  saveLocal(); pushDay(date);
}
function toggle(date, id){ setEntry(date, id, {done: !isDone(date,id)}); }

async function initCloud(){
  try{
    const [app, store] = await Promise.all([
      import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js'),
      import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js')
    ]);
    FS = store;
    const a = app.initializeApp(FB);
    try{
      db = store.initializeFirestore(a, {localCache: store.persistentLocalCache({tabManager: store.persistentMultipleTabManager()})});
    }catch(e){ db = store.getFirestore(a); }
    syncOn = true;
    syncState('on','synced');

    store.onSnapshot(store.doc(db,'habit_config','main'), snap=>{
      const d = snap.data();
      if(!d || !Array.isArray(d.habits) || !d.habits.length) { if(!snap.metadata.hasPendingWrites && snap.exists()===false) pushConfig(); return; }
      if((d.updatedAt||0) > (S.cfgUpdated||0)){
        S.habits = d.habits; S.cfgUpdated = d.updatedAt||0; saveLocal(); softRender();
      }
    }, err=>syncState('err','offline'));

    store.onSnapshot(store.collection(db,'habit_days'), snap=>{
      let touched = false;
      snap.docChanges().forEach(ch=>{
        const id = ch.doc.id;
        if(ch.type === 'removed'){ if(S.days[id]){ delete S.days[id]; touched = true; } return; }
        const e = ch.doc.data().entries || {};
        if(JSON.stringify(S.days[id]||{}) !== JSON.stringify(e)){
          if(Object.keys(e).length) S.days[id] = e; else delete S.days[id];
          touched = true;
        }
      });
      if(touched){ saveLocal(); softRender(); }
      syncState(navigator.onLine ? 'on' : 'off', navigator.onLine ? 'synced' : 'offline');
    }, err=>syncState('err','offline'));
  }catch(e){
    console.warn('cloud off', e);
    syncState('off','local only');
  }
}
function pushDay(date){
  if(!syncOn) return;
  const body = {entries: S.days[date] || {}, updatedAt: Date.now()};
  FS.setDoc(FS.doc(db,'habit_days',date), body).catch(()=>{});
}
function pushConfig(){
  if(!syncOn) return;
  S.cfgUpdated = Date.now(); saveLocal();
  FS.setDoc(FS.doc(db,'habit_config','main'), {habits: S.habits, updatedAt: S.cfgUpdated}).catch(()=>{});
}

/* ============================== streaks & math ============================== */
function streak(pred){
  let d = new Date(), n = 0;
  if(!pred(iso(d))) d = addDays(d,-1);
  while(pred(iso(d))){ n++; d = addDays(d,-1); if(n>3650) break; }
  return n;
}
function bestStreak(pred){
  const dates = Object.keys(S.days).sort();
  let best = 0, cur = 0, prev = null;
  for(const dt of dates){
    if(!pred(dt)) continue;
    cur = (prev && iso(addDays(parseISO(prev),1)) === dt) ? cur+1 : 1;
    prev = dt; if(cur > best) best = cur;
  }
  return best;
}
function weekDates(anchor){ return Array.from({length:7},(_,i)=>iso(addDays(anchor,i))); }
function countInWeek(anchor,id){ return weekDates(anchor).filter(d=>isDone(d,id)).length; }
function lastNDays(n){ const out=[]; for(let i=n-1;i>=0;i--) out.push(iso(addDays(new Date(),-i))); return out; }
function nice(n){
  if(n === null || n === undefined || isNaN(n)) return '0';
  const r = Math.round(n*10)/10;
  return (r % 1 === 0 ? r.toFixed(0) : r.toFixed(1)).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
}

function ring(done,total){
  const r = 29, c = 2*Math.PI*r, pct = total ? done/total : 0;
  const full = total && done===total;
  return `<div class="ring"><svg width="66" height="66" viewBox="0 0 66 66">
    <circle cx="33" cy="33" r="${r}" fill="none" stroke="var(--line-soft)" stroke-width="6"/>
    <circle cx="33" cy="33" r="${r}" fill="none" stroke="${full?'var(--c3)':'var(--ink)'}" stroke-width="6" stroke-linecap="round"
      stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${(c*(1-pct)).toFixed(1)}" style="transition:stroke-dashoffset .55s cubic-bezier(.32,.72,0,1)"/>
  </svg><div class="val num">${full ? SVG(ICONS.check,'stroke-width="3"') : `${done}<span class="of">/${total}</span>`}</div></div>`;
}
const esc = s => String(s??'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cvar = h => `--c:var(--${h.color})`;

/* ============================== TODAY ============================== */

  const total = live.length;
  const done = live.filter(h=>isDone(t,h.id)).length;

  const wk = startOfWeek(new Date());

  let h = `<div class="card hero ${total&&done===total?'perfect':''}">${ring(done,total)}
    <div class="hero-txt">
      <h2>${fmtDate(new Date(),{weekday:'long'})}</h2>
      <p>${total===0 ? 'Add a habit to get started' : done===total ? 'All done — perfect day 🎉' : `${total-done} left · ${fmtDate(new Date(),{month:'long',day:'numeric'})}`}</p>
    </div>
    <div class="hero-stat"><b class="num">${dStreak}</b><span>Day streak</span></div>
  </div>`;

  if(!S.habits.length) return h + `<div class="card empty">No habits yet. Tap the gear up top to add one.</div>`;

  h += `<div class="sec-title">Today</div>`;
  const strip = lastNDays(7);
  live.forEach(hb=>{
    const e = entry(t,hb.id) || {};
    const on = !!e.done;
    const st = streak(d=>isDone(d,hb.id));
    const wkN = countInWeek(wk,hb.id);
    const showNote = openNotes.has(hb.id) || !!e.note;
    h += `<div class="card hcard ${on?'done':''}" style="${cvar(hb)}">
      <button class="check ${on?'on':''}" data-toggle="${hb.id}|${t}" aria-label="Mark ${esc(hb.name)} done">
        <span class="em">${emo(hb)}</span>${on?`<span class="badge">${SVG(ICONS.check)}</span>`:''}
      </button>
      <div class="hbody">
        <div class="hrow">
          <div style="min-width:0">
            <p class="hname">${esc(hb.name)}</p>
            <p class="hsub">${[hb.goal?`${nice(hb.goal)} ${hb.unit||''}`.trim()+' a day':'', hb.weekly?`<b class="num" style="color:${wkN>=hb.weekly?'var(--c3)':'var(--muted)'}">${wkN}/${hb.weekly}</b> this week`:''].filter(Boolean).join(' · ')}</p>
          </div>
          <div class="acts">
            ${st>0 ? `<span class="streak ${st>=3?'hot':''}">${SVG(ICONS.flame,'width="12" height="12" fill="currentColor" stroke="none"')}${st}</span>` : ''}
            <button class="notebtn ${e.note?'on':''}" data-note="${hb.id}" aria-label="Note" data-tip="${e.note?'Edit note':'Add a note'}">${SVG(ICONS.note)}</button>
          </div>
        </div>
        ${showNote?`<textarea class="note" placeholder="Anything worth remembering?" data-notetxt="${hb.id}|${t}">${esc(e.note||'')}</textarea>`:''}
        <div class="strip">
          ${strip.map(d=>{
            const dn = isDone(d,hb.id), isT = d===t, pre = !active(hb,d);
            return `<div class="sday"><button class="sbox ${dn?'on':''} ${isT?'today':''} ${pre?'pre':''}" ${pre?'disabled':''} data-toggle="${hb.id}|${d}" aria-label="${d}"></button><small>${DOW1[(parseISO(d).getDay()+6)%7]}</small></div>`;
          }).join('')}

  });

    h += `<div class="card hcard pending" style="${cvar(hb)}">
      <div class="check pend"><span class="em">${emo(hb)}</span></div>

}

/* ============================== WEEK ============================== */
function renderWeek(){
  const dates = weekDates(weekAnchor);
  const t = TODAY();
  const thisWk = iso(startOfWeek(new Date()));
  const isThis = iso(weekAnchor) === thisWk;
  const s = weekAnchor, e = addDays(weekAnchor,6);
  const sameMonth = s.getMonth()===e.getMonth();
  const range = sameMonth
    ? `${fmtDate(s,{month:'long',day:'numeric'})} – ${e.getDate()}`
    : `${fmtDate(s,{month:'short',day:'numeric'})} – ${fmtDate(e,{month:'short',day:'numeric'})}`;
  const wkLive = S.habits.filter(hb=>dates.some(d=>active(hb,d)));
  const totalDone = wkLive.reduce((a,hb)=>a+Math.min(countInWeek(weekAnchor,hb.id), hb.weekly||7),0);
  const totalTarget = wkLive.reduce((a,hb)=>a+(hb.weekly||0),0);

  let h = `<div class="pnav">
    <div><h3>${isThis?'This week':range}</h3><div class="sub">${isThis?range:''}${isThis?'':''}</div></div>
    <div class="spacer"></div>
    ${!isThis?`<button class="today-b" data-wk="now">This week</button>`:''}
    <button class="nav-b" data-wk="-1">${SVG('<path d="m15 18-6-6 6-6"/>','width="16" height="16"')}</button>
    <button class="nav-b" data-wk="1" ${iso(addDays(weekAnchor,7))>thisWk?'disabled':''}>${SVG('<path d="m9 18 6-6-6-6"/>','width="16" height="16"')}</button>
  </div>`;

  h += `<div class="card wk">
    <div class="wdays">${dates.map((d,i)=>`<div class="hd ${d===t?'now':''}">${DOW1[i]}<b class="num">${parseISO(d).getDate()}</b></div>`).join('')}</div>
    ${S.habits.map(hb=>{
      const n = countInWeek(weekAnchor,hb.id);
      const tgt = hb.weekly||7;
      const liveHere = dates.some(d=>active(hb,d));
      return `<div class="wrow" style="${cvar(hb)}">
        <div class="wlab-top"><span class="em">${emo(hb)}</span><span>${esc(hb.name)}</span>${
          liveHere ? `<b class="num ${n>=(hb.weekly||99)?'hit':''}">${n}/${hb.weekly||'-'}</b>`
                   : `<span class="soon">${fmtDate(parseISO(hb.start),{month:'short',day:'numeric'})}</span>`}</div>
        ${liveHere?`<div class="wbar"><i style="width:${Math.min(100,(n/tgt)*100)}%"></i></div>`:'<div style="height:9px"></div>'}
        <div class="wcells">${dates.map(d=>{
          const dn = isDone(d,hb.id), fut = d>t, pre = !active(hb,d);
          return `<button class="cell ${dn?'on':''} ${d===t&&!pre?'now':''} ${fut&&!pre?'fut':''} ${pre?'pre':''}" style="${cvar(hb)}" ${(fut||pre)?'disabled':''} data-toggle="${hb.id}|${d}" data-tip="${esc(hb.name)} · ${fmtDate(parseISO(d),{weekday:'short',month:'short',day:'numeric'})}${pre?' · not started yet':dn?' · done':''}">${dn?SVG(ICONS.check):''}</button>`;
        }).join('')}</div>
      </div>`;
    }).join('')}`;

  const perfect = dates.filter(d=>d<=t && allDone(d)).length;
  h += `<div class="legend" style="padding:14px 0 4px;border-top:1px solid var(--line-soft);margin-top:12px">
      <div class="lg" style="--c:var(--ink)"><i></i><b style="color:var(--ink)">${totalDone}/${totalTarget||'-'}</b> target days hit</div>
      ${perfect?`<div class="lg" style="--c:var(--c3)"><i></i><b style="color:var(--ink)">${perfect}</b> perfect ${perfect===1?'day':'days'}</div>`:''}
    </div></div>`;
  return h;
}

/* ============================== MONTH ============================== */
function renderMonth(){
  const y = monthAnchor.getFullYear(), m = monthAnchor.getMonth();
  const first = new Date(y,m,1), last = new Date(y,m+1,0);
  const lead = (first.getDay()+6)%7;
  const t = TODAY();
  const thisMonth = y===new Date().getFullYear() && m===new Date().getMonth();
  const dates = [];
  for(let d=1; d<=last.getDate(); d++) dates.push(iso(new Date(y,m,d)));
  const pipCls = S.habits.length===1?'one':'';

  let h = `<div class="pnav">
    <div><h3>${MONTHS[m]} ${y}</h3></div>
    <div class="spacer"></div>
    ${!thisMonth?`<button class="today-b" data-mo="now">This month</button>`:''}
    <button class="nav-b" data-mo="-1">${SVG('<path d="m15 18-6-6 6-6"/>','width="16" height="16"')}</button>
    <button class="nav-b" data-mo="1" ${thisMonth?'disabled':''}>${SVG('<path d="m9 18 6-6-6-6"/>','width="16" height="16"')}</button>
  </div>`;

  h += `<div class="card"><div class="mgrid">
    ${DOW.map(d=>`<div class="mhd">${d[0]}</div>`).join('')}
    ${Array.from({length:lead},()=>`<div class="mday pad"></div>`).join('')}
    ${dates.map(d=>{
      const fut = d>t;
      const pips = S.habits.map(hb=>`<div class="pip ${isDone(d,hb.id)?'on':''} ${active(hb,d)?'':'na'}" style="${cvar(hb)}"></div>`).join('');
      const n = S.habits.filter(hb=>isDone(d,hb.id)).length;
      return `<button class="mday ${d===t?'now':''} ${fut?'fut':''}" data-day="${d}" data-tip="${fmtDate(parseISO(d),{weekday:'short',month:'short',day:'numeric'})} · ${n}/${activeOn(d).length}">
        <span class="d num">${parseISO(d).getDate()}</span>
        <div class="pips ${pipCls}">${pips}</div>
      </button>`;
    }).join('')}
  </div>
  <div class="legend">${S.habits.map(hb=>`<div class="lg" style="${cvar(hb)}"><i></i><span class="em">${emo(hb)}</span> ${esc(hb.name)}</div>`).join('')}</div>
  </div>`;

  h += `<div class="sec-title">${MONTHS[m]} progress</div><div class="card" style="padding:6px 16px 14px">`;
  const elapsed = thisMonth ? new Date().getDate() : last.getDate();
  S.habits.forEach((hb,idx)=>{
    const n = dates.filter(d=>isDone(d,hb.id)).length;
    const done_days = dates.filter((d,i)=>i<elapsed && active(hb,d)).length;
    const expected = hb.weekly ? Math.max(1, Math.round(done_days/7*hb.weekly)) : done_days;
    const pct = done_days ? Math.min(100, Math.round(n/expected*100)) : 0;
    h += `<div style="${cvar(hb)};padding:11px 0;${idx===S.habits.length-1?'':'border-bottom:1px solid var(--line-soft)'}">
      <div style="display:flex;align-items:center;gap:9px;margin-bottom:6px">
        <span class="em" style="font-size:16px">${emo(hb)}</span>
        <span style="font-size:13.5px;font-weight:600">${esc(hb.name)}</span>
        <span style="margin-left:auto;font-size:12.5px;font-weight:700" class="num">${n} day${n===1?'':'s'}</span>
      </div>
      <div class="wbar" style="height:7px"><i style="width:${pct}%"></i></div>
      <div style="font-size:11.5px;color:var(--faint);font-weight:600;margin-top:5px">${done_days ? `${pct}% of pace${hb.weekly?` (${hb.weekly}× a week)`:''}` : startTxt(hb)}</div>
    </div>`;
  });
  h += `</div>`;
  return h;
}

/* ============================== STATS ============================== */
function weeklySeries(id, n){
  const cur = startOfWeek(new Date()), out = [];
  for(let i=n-1;i>=0;i--){
    const a = addDays(cur,-7*i);
    out.push({start:a, v:countInWeek(a,id)});
  }
  return out;
}
function renderStats(){
  const t = TODAY();
  const l30 = lastNDays(30);
  const expected30 = Math.max(1, Math.round(S.habits.reduce((a,h)=>a + (h.weekly||7)/7*l30.filter(d=>active(h,d)).length, 0)));
  const done30 = S.habits.reduce((a,h)=>a+l30.filter(d=>isDone(d,h.id)).length,0);
  const consistency = Math.min(100, Math.round(done30/expected30*100));
  const perfect = Object.keys(S.days).filter(d=>allDone(d)).length;

  let h = `<div class="tiles">
    <div class="card tile"><b class="num">${streak(anyDone)}</b><span>Day streak</span></div>
    <div class="card tile"><b class="num">${bestStreak(anyDone)}</b><span>Best streak</span></div>
    <div class="card tile"><b class="num">${consistency}%</b><span>Last 30 days</span></div>
    <div class="card tile"><b class="num">${perfect}</b><span>Perfect days</span></div>
  </div>`;

  if(!S.habits.length) return h;
  h += `<div class="sec-title">By habit</div>`;

  S.habits.forEach(hb=>{
    const st = streak(d=>isDone(d,hb.id));
    const best = bestStreak(d=>isDone(d,hb.id));
    const n30 = l30.filter(d=>isDone(d,hb.id)).length;
    const elig = l30.filter(d=>active(hb,d)).length;
    const exp30 = Math.max(1, Math.round((hb.weekly||7)/7*elig));
    const pct = elig ? Math.min(100, Math.round(n30/exp30*100)) : 0;
    const totalDays = Object.keys(S.days).filter(d=>isDone(d,hb.id)).length;
    const mStart = iso(new Date(new Date().getFullYear(), new Date().getMonth(), 1));
    const thisMonth = Object.keys(S.days).filter(d=>d>=mStart && isDone(d,hb.id)).length;
    const series = weeklySeries(hb.id, 12);
    const max = Math.max(hb.weekly||1, ...series.map(s=>s.v), 1);

    h += `<div class="card scard" style="${cvar(hb)}">
      <div class="shead"><span class="em">${emo(hb)}</span><h4>${esc(hb.name)}</h4><span class="pct num">${elig?`${pct}% of pace`:startTxt(hb)}</span></div>
      <div class="srow">
        <div class="sstat"><b class="num">${st}</b><span>Streak</span></div>
        <div class="sstat"><b class="num">${best}</b><span>Best</span></div>
        <div class="sstat"><b class="num">${thisMonth}</b><span>This month</span></div>
        <div class="sstat"><b class="num">${totalDays}</b><span>All time</span></div>
      </div>
      ${elig ? `<p class="chart-cap">Days completed per week — last 12 weeks</p>
      <div class="chart">
        ${series.map(s=>{
          const pctH = Math.round(s.v/max*100);
          const lbl = fmtDate(s.start,{month:'short',day:'numeric'});
          return `<div class="bar ${s.v?'':'empty'}" data-tip="Week of ${lbl} · ${s.v} day${s.v===1?'':'s'}"><i style="height:${s.v?Math.max(6,pctH):4}%"></i></div>`;
        }).join('')}
      </div>
      <div class="xax"><span>${fmtDate(series[0].start,{month:'short',day:'numeric'})}</span><span>this week</span></div>` : ''}
    </div>`;
  });
  return h;
}

/* ============================== sheet ============================== */
let sheetMode = null, sheetDate = null;
const scrim = document.getElementById('scrim'), sheet = document.getElementById('sheet');
function openSheet(){ scrim.classList.add('on'); sheet.classList.add('on'); }
function closeSheet(){ scrim.classList.remove('on'); sheet.classList.remove('on'); sheetMode = null; render(); }
function renderSheet(){
  const title = document.getElementById('sheetTitle'), body = document.getElementById('sheetBody');
  if(sheetMode === 'day'){
    const d = parseISO(sheetDate);
    title.textContent = fmtDate(d,{weekday:'long', month:'long', day:'numeric'});
    body.innerHTML = `<div class="card" style="padding:4px 14px">
      ${S.habits.map(hb=>{
        const e = entry(sheetDate,hb.id)||{};
        const on = active(hb,sheetDate);
        return `<button class="dayedit ${on?'':'pending'}" style="${cvar(hb)}" data-dtoggle="${hb.id}">
          <span class="mini ${e.done?'on':''} ${on?'':'pend'}"><span class="em">${emo(hb)}</span>${e.done?`<span class="badge">${SVG(ICONS.check)}</span>`:''}</span>
          <span class="nm">${esc(hb.name)}</span>
          <span class="dstate">${!on ? fmtDate(parseISO(hb.start),{month:'short',day:'numeric'}) : e.done?'Done':'Not yet'}</span>
        </button>`;
      }).join('')}
    </div>
    <div class="row-b"><button class="btn btn-ghost btn-full" id="clearDay">Clear this day</button></div>`;
    return;
  }
  title.textContent = 'Habits & settings';
  body.innerHTML = S.habits.map((hb,i)=>`
    <div class="card ecard" style="${cvar(hb)}">
      <div class="ehead">
        <input class="inp emoji-in" value="${emo(hb)}" data-hf="${hb.id}|emoji" aria-label="Emoji">
        <input class="inp" style="font-weight:700" value="${esc(hb.name)}" data-hf="${hb.id}|name" placeholder="Habit name">
      </div>
      <div class="fgrid">
        <div><label class="lbl">Daily target</label><input class="inp num" type="number" step="any" value="${hb.goal??''}" data-hf="${hb.id}|goal" placeholder="—"></div>
        <div><label class="lbl">Unit</label><input class="inp" value="${esc(hb.unit||'')}" data-hf="${hb.id}|unit" placeholder="min"></div>
        <div><label class="lbl">Days / week</label>
          <select class="inp" data-hf="${hb.id}|weekly">${[1,2,3,4,5,6,7].map(n=>`<option value="${n}" ${hb.weekly===n?'selected':''}>${n}×</option>`).join('')}</select>
        </div>
      </div>
      <div style="margin-top:10px"><label class="lbl">Starts on</label>
        <input type="date" class="inp" value="${hb.start||''}" data-hf="${hb.id}|start"></div>
      <p class="hint" style="margin:8px 0 0;font-size:12px">The daily target is just a reminder on the card. A start date hides the habit from today's count until then — leave it blank to start now.</p>
      <label class="lbl" style="margin-top:12px">Color</label>
      <div class="swatches">${PAL.map(c=>`<button class="sw ${hb.color===c?'on':''}" style="background:${PAL_HEX[c]}" data-hcol="${hb.id}|${c}" aria-label="${c}"></button>`).join('')}</div>
      <label class="lbl" style="margin-top:12px">Emoji</label>
      <div class="epick">${EMOJI_SET.map(k=>`<button class="eb ${emo(hb)===k?'on':''}" data-hemo="${hb.id}|${k}">${k}</button>`).join('')}</div>
      <div class="row-b">
        <button class="btn btn-ghost" data-hmove="${hb.id}|-1" ${i===0?'disabled style="opacity:.4"':''}>↑</button>
        <button class="btn btn-ghost" data-hmove="${hb.id}|1" ${i===S.habits.length-1?'disabled style="opacity:.4"':''}>↓</button>
        <div class="spacer" style="flex:1"></div>
        <button class="btn btn-red" data-hdel="${hb.id}">Delete</button>
      </div>
    </div>`).join('')
    + `<button class="btn btn-dark btn-full" id="addHabit" style="margin-top:4px">+ Add habit</button>
    <div class="sec-title">Sync & data</div>
    <div class="card" style="padding:15px">
      <p class="hint" id="syncHint"></p>
      <div class="row-b"><button class="btn btn-ghost" id="exp">Export backup</button><button class="btn btn-ghost" id="imp">Import backup</button></div>
      <input type="file" id="impFile" accept="application/json" style="display:none">
      <div class="row-b"><button class="btn btn-red btn-full" id="wipe">Erase all history</button></div>
    </div>`;
  const hint = document.getElementById('syncHint');
  hint.innerHTML = syncOn
    ? 'Signed in to your cloud database. Every change saves instantly and shows up on your iPhone and laptop within a second — no buttons to press. Works offline too; anything you tap while offline uploads when you reconnect.'
    : 'Cloud sync could not connect right now, so changes are saved on this device only. They will upload the next time the app opens online.';
}

/* ============================== tooltip ============================== */
const tip = document.getElementById('tip');
function bindTips(){
  document.querySelectorAll('[data-tip]').forEach(el=>{
    el.addEventListener('mouseenter', ()=>{ tip.textContent = el.dataset.tip; tip.classList.add('on'); place(el); });
    el.addEventListener('mousemove', ()=>place(el));
    el.addEventListener('mouseleave', ()=>tip.classList.remove('on'));
  });
}
function place(el){
  const r = el.getBoundingClientRect();
  tip.style.left = Math.min(window.innerWidth-8, Math.max(8, r.left + r.width/2)) + 'px';
  tip.style.top = r.top + 'px';
}
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('on');
  clearTimeout(el._t); el._t = setTimeout(()=>el.classList.remove('on'), 1900);
}

/* ============================== render ============================== */
function render(){
  document.getElementById('todayLbl').textContent = fmtDate(new Date(),{month:'short', day:'numeric'});
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on', b.dataset.view===view));
  const el = document.getElementById('view');
  el.innerHTML = view==='today' ? renderToday() : view==='week' ? renderWeek() : view==='month' ? renderMonth() : renderStats();
  bindTips();
  if(sheetMode) renderSheet();
}
function softRender(){
  const a = document.activeElement;
  if(a && (a.tagName==='INPUT' || a.tagName==='TEXTAREA')){ pendingRender = true; return; }
  render();
}

/* ============================== events ============================== */
function pop(key){
  const b = document.querySelector(`.check[data-toggle="${key}"]`);
  if(b && b.classList.contains('on')) b.classList.add('pop');
  if(navigator.vibrate) try{ navigator.vibrate(8); }catch(e){}
}
document.addEventListener('click', e=>{
  const q = s => e.target.closest(s);
  let el;

  if((el = q('.tab'))){ view = el.dataset.view; render(); window.scrollTo({top:0,behavior:'smooth'}); return; }

  if((el = q('[data-toggle]'))){
    const [id,date] = el.dataset.toggle.split('|');
    const hb0 = habitById(id);
    if(date > TODAY() || (hb0 && !active(hb0,date))) return;
    toggle(date,id); render(); pop(el.dataset.toggle); return;
  }
  if((el = q('[data-note]'))){
    const id = el.dataset.note;
    openNotes.has(id) ? openNotes.delete(id) : openNotes.add(id);
    render(); return;
  }
  if((el = q('[data-wk]'))){
    const v = el.dataset.wk;
    weekAnchor = v==='now' ? startOfWeek(new Date()) : addDays(weekAnchor, Number(v)*7);
    render(); return;
  }
  if((el = q('[data-mo]'))){
    const v = el.dataset.mo;
    monthAnchor = v==='now' ? new Date(new Date().getFullYear(), new Date().getMonth(), 1)
                            : new Date(monthAnchor.getFullYear(), monthAnchor.getMonth()+Number(v), 1);
    render(); return;
  }
  if((el = q('[data-day]'))){ sheetMode='day'; sheetDate = el.dataset.day; renderSheet(); openSheet(); return; }

  if(q('#btnEdit')){ sheetMode='edit'; renderSheet(); openSheet(); return; }
  if(q('#sheetClose') || e.target === scrim){ closeSheet(); return; }

  /* ---- day sheet ---- */
  if((el = q('[data-dtoggle]'))){
    const hb0 = habitById(el.dataset.dtoggle);
    if(sheetDate > TODAY() || (hb0 && !active(hb0,sheetDate))) return;
    toggle(sheetDate, el.dataset.dtoggle); renderSheet(); return;
  }
  if(q('#clearDay')){
    delete S.days[sheetDate]; saveLocal(); pushDay(sheetDate); renderSheet(); toast('Day cleared'); return;
  }

  /* ---- edit sheet ---- */
  if((el = q('[data-hcol]'))){
    const [id,c] = el.dataset.hcol.split('|');
    habitById(id).color = c; pushConfig(); renderSheet(); return;
  }
  if((el = q('[data-hemo]'))){
    const [id,k] = el.dataset.hemo.split('|');
    habitById(id).emoji = k; pushConfig(); renderSheet(); return;
  }
  if((el = q('[data-hmove]'))){
    const [id,dir] = el.dataset.hmove.split('|');
    const i = S.habits.findIndex(h=>h.id===id), j = i + Number(dir);
    if(j<0 || j>=S.habits.length) return;
    [S.habits[i], S.habits[j]] = [S.habits[j], S.habits[i]];
    pushConfig(); renderSheet(); return;
  }
  if((el = q('[data-hdel]'))){
    const id = el.dataset.hdel, hb = habitById(id);
    if(!confirm(`Delete "${hb.name}"? Its history stays saved in case you add it back.`)) return;
    S.habits = S.habits.filter(h=>h.id!==id);
    pushConfig(); renderSheet(); toast('Habit deleted'); return;
  }
  if(q('#addHabit')){
    const used = S.habits.map(h=>h.color);
    const color = PAL.find(c=>!used.includes(c)) || PAL[S.habits.length % PAL.length];
    S.habits.push({id:'h'+Date.now().toString(36), name:'New habit', emoji:'\u{2B50}', color, unit:'', goal:null, weekly:5});
    pushConfig(); renderSheet();
    setTimeout(()=>{ const ins = document.querySelectorAll('[data-hf$="|name"]'); const last = ins[ins.length-1]; if(last){ last.focus(); last.select(); } },60);
    return;
  }
  if(q('#exp')){
    const blob = new Blob([JSON.stringify(S,null,2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = `habits-backup-${TODAY()}.json`; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 4000); return;
  }
  if(q('#imp')){ document.getElementById('impFile').click(); return; }
  if(q('#wipe')){
    if(!confirm('Erase every logged day? Your habits stay, the history is gone. This cannot be undone.')) return;
    const keys = Object.keys(S.days);
    S.days = {}; saveLocal();
    if(syncOn) keys.forEach(k=>FS.deleteDoc(FS.doc(db,'habit_days',k)).catch(()=>{}));
    renderSheet(); toast('History erased'); return;
  }
});

document.addEventListener('change', e=>{
  const t = e.target;
  if(t.dataset.hf){
    const [id,field] = t.dataset.hf.split('|');
    const hb = habitById(id); if(!hb) return;
    if(field==='name')   hb.name = t.value.trim() || 'Untitled';
    if(field==='emoji')  hb.emoji = [...t.value.trim()].slice(0,3).join('') || '\u{2B50}';
    if(field==='unit')   hb.unit = t.value.trim();
    if(field==='goal')   hb.goal = t.value === '' ? null : Number(t.value);
    if(field==='weekly') hb.weekly = Number(t.value);
    if(field==='start')  { if(t.value) hb.start = t.value; else delete hb.start; }
    pushConfig(); return;
  }
  if(t.id === 'impFile' && t.files[0]){
    const fr = new FileReader();
    fr.onload = () => {
      try{
        const d = JSON.parse(fr.result);
        if(!d.days) throw 0;
        if(Array.isArray(d.habits) && d.habits.length) S.habits = d.habits;
        S.days = d.days; saveLocal(); pushConfig();
        if(syncOn) Object.keys(S.days).forEach(k=>pushDay(k));
        renderSheet(); render(); toast('Backup restored');
      }catch(err){ alert('That file could not be read.'); }
    };
    fr.readAsText(t.files[0]); t.value = '';
  }
});

let noteTimer;
document.addEventListener('input', e=>{
  const t = e.target;
  if(t.dataset.notetxt){
    clearTimeout(noteTimer);
    const [id,date] = t.dataset.notetxt.split('|'), v = t.value;
    noteTimer = setTimeout(()=>setEntry(date,id,{note:v}), 450);
  }
});
document.addEventListener('focusout', ()=>{
  setTimeout(()=>{
    const a = document.activeElement;
    if(pendingRender && !(a && (a.tagName==='INPUT'||a.tagName==='TEXTAREA'))){ pendingRender = false; render(); }
  }, 80);
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && sheetMode) closeSheet(); });
addEventListener('scroll', ()=>document.getElementById('topbar').classList.toggle('stuck', scrollY > 4), {passive:true});

/* midnight / return-to-app refresh */
let lastDay = TODAY();
function checkDay(){ if(TODAY() !== lastDay){ lastDay = TODAY(); weekAnchor = startOfWeek(new Date()); render(); } }
setInterval(checkDay, 30000);
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) checkDay(); });

/* ============================== boot ============================== */
loadLocal();
render();
initCloud();
if('serviceWorker' in navigator) addEventListener('load', ()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
